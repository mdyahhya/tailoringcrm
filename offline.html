<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Iqbal Fashion ERP</title>
  <link rel="icon" type="image/jpeg" href="/icons/iqbal_logo.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#12306B">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #FFFFFF;
      color: #0A0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      line-height: 1.5;
    }
    .offline-card {
      max-width: 440px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      padding: 40px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background-color: #F4F5F7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12306B;
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0A0A0A;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #64748B;
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #12306B;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      width: 100%;
      min-height: 44px;
    }
    .btn-retry:hover {
      background-color: #1E3A8A;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .brand-tag {
      margin-top: 32px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-wrapper">
      <!-- Wifi Off SVG icon (24x24 viewBox, 1.75 stroke) -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>Please check your internet connection. Iqbal Fashion ERP requires network access to sync tailoring pipeline data in real time.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      Retry Connection
    </button>
    <div class="brand-tag">Iqbal Fashion ERP</div>
  </div>
</body>
</html>
