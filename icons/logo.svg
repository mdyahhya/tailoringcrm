<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <!-- Background is transparent -->
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 5 COLORFUL FOUNTAIN PEN / EMBROIDERY NEEDLE NIBS (STAR FORMATION) -->
  <g transform="translate(300, 140)" filter="url(#softGlow)">
    <!-- Nib 1: Top-Left (Magenta/Purple #C026D3) -->
    <g transform="rotate(-65)">
      <path d="M 0,-12 C -15,-28 -18,-54 0,-78 C 18,-54 15,-28 0,-12 Z" fill="#D946EF" stroke="#C026D3" stroke-width="1.2"/>
      <circle cx="0" cy="-38" r="2.5" fill="#FFFFFF"/>
      <line x1="0" y1="-40" x2="0" y2="-76" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Nib 2: Top-Right (Lime Green #84CC16) -->
    <g transform="rotate(5)">
      <path d="M 0,-12 C -15,-28 -18,-54 0,-78 C 18,-54 15,-28 0,-12 Z" fill="#84CC16" stroke="#65A30D" stroke-width="1.2"/>
      <circle cx="0" cy="-38" r="2.5" fill="#FFFFFF"/>
      <line x1="0" y1="-40" x2="0" y2="-76" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Nib 3: Right (Cyan / Turquoise #06B6D4) -->
    <g transform="rotate(78)">
      <path d="M 0,-12 C -15,-28 -18,-54 0,-78 C 18,-54 15,-28 0,-12 Z" fill="#06B6D4" stroke="#0891B2" stroke-width="1.2"/>
      <circle cx="0" cy="-38" r="2.5" fill="#FFFFFF"/>
      <line x1="0" y1="-40" x2="0" y2="-76" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Nib 4: Bottom (Warm Amber/Gold #F59E0B) -->
    <g transform="rotate(150)">
      <path d="M 0,-12 C -15,-28 -18,-54 0,-78 C 18,-54 15,-28 0,-12 Z" fill="#F59E0B" stroke="#D97706" stroke-width="1.2"/>
      <circle cx="0" cy="-38" r="2.5" fill="#FFFFFF"/>
      <line x1="0" y1="-40" x2="0" y2="-76" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Nib 5: Left (Cerulean Blue #0284C7) -->
    <g transform="rotate(222)">
      <path d="M 0,-12 C -15,-28 -18,-54 0,-78 C 18,-54 15,-28 0,-12 Z" fill="#0284C7" stroke="#0369A1" stroke-width="1.2"/>
      <circle cx="0" cy="-38" r="2.5" fill="#FFFFFF"/>
      <line x1="0" y1="-40" x2="0" y2="-76" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  </g>

  <!-- "IQBAL" TYPOGRAPHY -->
  <g fill="#0A0A0A" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-weight="700">
    <!-- I -->
    <text x="65" y="325" font-size="115" letter-spacing="2">I</text>
    <!-- Q -->
    <text x="110" y="325" font-size="115" letter-spacing="2">Q</text>
    <!-- B -->
    <text x="260" y="325" font-size="115" letter-spacing="2">B</text>
    <!-- A -->
    <text x="365" y="325" font-size="115" letter-spacing="2">A</text>
    <!-- L -->
    <text x="475" y="325" font-size="115" letter-spacing="2">L</text>
  </g>

  <!-- THREAD SWOOSH CURVE: Starts near bottom of Q, dips down under B, swoops high across A and reaches L -->
  <path d="M 175,295 C 205,340 280,350 340,305 C 400,260 480,250 515,325" 
        fill="none" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Highlight inner thread glint -->
  <path d="M 178,295 C 206,338 280,348 340,304 C 398,261 478,252 512,323" 
        fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- "FASHION" OUTLINED SUBTITLE -->
  <text x="300" y="405" 
        font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" 
        font-size="46" 
        font-weight="400" 
        letter-spacing="20" 
        fill="none" 
        stroke="#1E293B" 
        stroke-width="1.8" 
        text-anchor="middle">FASHION</text>
</svg>
